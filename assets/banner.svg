<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0442bf" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #8b949e; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #c9d1d9; }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.6; }
      100% { transform: scale(1); opacity: 0.3; }
    }
    @keyframes float-slow {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float-fast {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-18px); }
      100% { transform: translateY(0px); }
    }
    
    .pulse-bg { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .floating-card-1 { animation: float-slow 5s ease-in-out infinite; }
    .floating-card-2 { animation: float-fast 4s ease-in-out infinite 1s; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Glowing Orbs (Background decoration only, kept away from text) -->
  <circle cx="150" cy="100" r="120" fill="#1f6feb" class="pulse-bg" filter="url(#glow)" opacity="0.25" />
  <circle cx="1050" cy="300" r="140" fill="#8957e5" class="pulse-bg" filter="url(#glow)" opacity="0.2" />

  <!-- Background Grid Lines -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M300 0 V400 M600 0 V400 M900 0 V400" stroke="#30363d" stroke-width="1" stroke-opacity="0.3" />

  <!-- Dynamic / Floating Background Cards (positioning on sides/bottom, non-interfering) -->
  <g class="floating-card-1" opacity="0.75">
    <rect x="60" y="260" width="220" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="90" cy="295" r="12" fill="#238636" />
    <text x="112" y="300" class="badge-text" fill="#3fb950">OCI Compliant</text>
    <text x="90" y="330" font-family="monospace" font-size="12" fill="#8b949e">v1.1 Spec Verified</text>
  </g>

  <g class="floating-card-2" opacity="0.75">
    <rect x="920" y="60" width="220" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="950" cy="95" r="12" fill="#8957e5" />
    <text x="972" y="100" class="badge-text" fill="#d2a8ff">Vulnerability Scanning</text>
    <text x="950" y="130" font-family="monospace" font-size="12" fill="#8b949e">Trivy &amp; Clair Ready</text>
  </g>

  <!-- Container Box Graphic (Center top accent) -->
  <g transform="translate(560, 45)" opacity="0.9">
    <rect x="0" y="0" width="80" height="50" rx="6" fill="#1f6feb" fill-opacity="0.2" stroke="#58a6ff" stroke-width="2" />
    <path d="M15 15 H65 M15 25 H65 M15 35 H45" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- FOREGROUND TEXT (Clear, unblocked & centered) -->
  <text x="600" y="150" text-anchor="middle" class="title">Awesome Container Image Registry 📦 🐳</text>
  <text x="600" y="195" text-anchor="middle" class="subtitle">Curated Directory of OCI Registries, Enterprise Platforms &amp; Security Tools</text>

  <!-- Central Badges / Pills -->
  <g transform="translate(340, 235)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="36" rx="18" fill="#21262d" stroke="#30363d" />
    <text x="80" y="23" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#58a6ff">☁️ Enterprise SaaS</text>
    
    <!-- Pill 2 -->
    <rect x="180" y="0" width="160" height="36" rx="18" fill="#21262d" stroke="#30363d" />
    <text x="260" y="23" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#3fb950">🔓 Open-Source</text>
    
    <!-- Pill 3 -->
    <rect x="360" y="0" width="160" height="36" rx="18" fill="#21262d" stroke="#30363d" />
    <text x="440" y="23" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#d2a8ff">🔐 Supply Chain Security</text>
  </g>

  <!-- Bottom Tagline -->
  <text x="600" y="340" text-anchor="middle" font-family="monospace" font-size="14" fill="#8b949e">Harbor • Zot • Docker Hub • Amazon ECR • Quay • Distribution • Cosign</text>

</svg>
